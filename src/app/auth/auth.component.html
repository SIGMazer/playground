<div class="dark-mode-bg d-flex justify-content-center align-items-center vh-100">
  <div class="card custom-card-color text-white shadow" style="width: auto; height: auto">
    <div class="card-body m-2">
      <h2 class="text-center">{{ isLogin ? 'Login' : 'Register' }}</h2>
      <form *ngIf="isLogin" [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
        <div class="form-group">
          <label for="loginUsername">Username:</label>
          <input type="text" id="loginUsername" class="form-control" formControlName="username" />
          <small *ngIf="isFieldInvalid('username',true)" class="text-danger">Username is required</small>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" class="form-control" formControlName="password" />
          <small *ngIf="isFieldInvalid('password',true)" class="text-danger">Password is required</small>
        </div>

        <button type="button" class="btn btn-primary btn-block" [disabled]="loginForm.invalid" (click)="onLoginSubmit()">Login</button>
      </form>

      <form *ngIf="!isLogin" [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
        <div class="form-group">
          <label for="registerUsername">Username:</label>
          <input type="text" id="registerUsername" class="form-control" formControlName="username" />
          <small *ngIf="isFieldInvalid('username',false)" class="text-danger">Username is required</small>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email:</label>
          <input type="email" id="registerEmail" class="form-control" formControlName="email" />
          <small *ngIf="isFieldInvalid('email',false)" class="text-danger">Valid email is required</small>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password:</label>
          <input type="password" id="registerPassword" class="form-control" formControlName="password" />
          <small *ngIf="isFieldInvalid('password',false)" class="text-danger">Password is required</small>
        </div>

        <button type="button" class="btn btn-primary btn-block" [disabled]="registerForm.invalid" (click)="onRegisterSubmit()">Register</button>
      </form>

      <p class="mt-2 text-center">
      {{ isLogin ? 'Don\'t have an account? ' : 'Already have an account? ' }}
      <a href="#" (click)="toggleForm()" class="text-light">{{ isLogin ? 'Register here' : 'Login here' }}</a>
      </p>
    </div>
  </div>
</div>
